<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Lac">
<meta name="theme-color" content="#3a3d42">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Le Lac qui regarde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#24262a;--paper:rgba(244,242,236,.82);--paperSolid:#f4f2ec;--muted:#62656a;--line:rgba(36,38,42,.16);--seal:#a3321f;
  --hud:#2a2c30;--hudShadow:rgba(255,255,255,.5);--poem:#2a2c30;--poemShadow:rgba(255,255,255,.55);--rain:#2f5f7d;
  /* fenêtre ronde de la météo et bandeau des prévisions juste dessous */
  --cs:min(84vw,430px,58vh);--itop:40%;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ebe7de;--paper:rgba(30,33,38,.8);--paperSolid:#1e2126;--muted:#a4a7aa;--line:rgba(235,231,222,.18);--rain:#9cc3dc}}
:root[data-theme="dark"]{--ink:#ebe7de;--paper:rgba(30,33,38,.8);--paperSolid:#1e2126;--muted:#a4a7aa;--line:rgba(235,231,222,.18);--rain:#9cc3dc}
@media (max-height:700px) and (max-aspect-ratio:1/1){:root{--cs:min(78vw,290px,44vh);--itop:37%}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:#9fa3a4;color:var(--ink);
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
.sans{font-family:"Zen Kaku Gothic New","Hiragino Sans","Helvetica Neue",Arial,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#9fa3a4;touch-action:none}
#grain{position:absolute;inset:0;pointer-events:none;opacity:var(--grainA,.6);background-repeat:repeat,no-repeat,no-repeat}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas.layer{pointer-events:none}
.lite{opacity:0;will-change:opacity;pointer-events:none}
#stage.px .layer,#stage.px .bough{will-change:transform,opacity}
.bough{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;animation:sway var(--swd,9s) ease-in-out infinite alternate}
#bough2{animation-duration:calc(var(--swd,9s) * 1.27)}
@keyframes sway{from{transform:rotate(calc(var(--sw,.4deg) * -1))}to{transform:rotate(var(--sw,.4deg))}}
#flash{position:absolute;inset:0;background:#e8edff;opacity:0;pointer-events:none}
/* couleurs du décor */
.cA{fill:var(--cA)}.cB{fill:var(--cB)}.cC{fill:var(--cC)}.cH{fill:var(--cH)}
.rf{fill:var(--rf)}.rfd{fill:var(--rfd)}.srfd{stroke:var(--rfd)}
.fr{fill:var(--fr)}.sfr{stroke:var(--fr)}
.ter{fill:var(--ter)}.st{fill:var(--st)}.tk{fill:var(--tk)}
.l0{fill:var(--l0)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}
.sil{fill:var(--sil)}.sn{fill:var(--sn)}.ssn{stroke:var(--sn)}
.far0{fill:var(--far0)}.far1{fill:var(--far1)}.far2{fill:var(--far2)}
.lan{fill:var(--lan)}
/* interface */
#hud{position:fixed;left:64px;right:64px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);height:44px;line-height:44px;text-align:center;
  font-size:15px;font-weight:300;letter-spacing:.03em;color:var(--hud);opacity:.72;pointer-events:none;
  text-shadow:0 0 10px var(--hudShadow);transition:color 2s;font-feature-settings:"tnum"}
#hud .deg{margin-left:.85em}
#hud .tag{margin-left:.85em;font-size:12.5px;opacity:.8}
#hud .day{margin-right:.6em}
#hud{transition:color 2s,opacity .6s,transform .6s}
#hud.scrub{opacity:1;transform:scale(1.18)}
#poem{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + max(70px,8.5vh));margin:0 auto;max-width:30em;
  padding:6px 28px;text-align:center;font-size:clamp(17px,2.3vh,25px);line-height:1.8;letter-spacing:.025em;
  color:var(--poem);text-shadow:0 0 16px var(--poemShadow),0 0 3px var(--poemShadow);opacity:0;z-index:1;transition:opacity 1.8s ease,color 2s;cursor:pointer}
#poem.show{opacity:.92}
#poem{pointer-events:none}
#poem .ln{display:block}
#poem .w{display:inline-block;opacity:0}
#poem .w.in{-webkit-mask-image:linear-gradient(90deg,#000 44%,transparent 58%);mask-image:linear-gradient(90deg,#000 44%,transparent 58%);
  -webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:ink 2.1s cubic-bezier(.32,.55,.3,1) var(--d,0s) both}
@keyframes ink{0%{opacity:0;filter:blur(4px);-webkit-mask-position:100% 0;mask-position:100% 0;transform:translateY(1.5px)}
  30%{opacity:1}100%{opacity:1;filter:blur(0);-webkit-mask-position:0 0;mask-position:0 0;transform:none}}
#poem .w.out{opacity:1;animation:mist 2.4s ease-in var(--d,0s) forwards}
@keyframes mist{0%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(10px);transform:translate(var(--dx,0px),-16px) scale(1.07)}}
#poem::before{content:"";position:absolute;inset:-34px -8px;z-index:-1;border-radius:50%;background:radial-gradient(ellipse at center,var(--poemShadow) 0%,transparent 68%);opacity:.9}
.corner{position:fixed;z-index:2;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:44px;height:44px;border:0;background:none;padding:0;
  display:grid;place-items:center;cursor:pointer;opacity:.6;color:var(--hud);transition:opacity .4s,color 2s}
.corner:active{opacity:1}
#seal{left:calc(env(safe-area-inset-left,0px) + 12px)}
#soundBtn{right:calc(env(safe-area-inset-right,0px) + 12px)}
#soundBtn.muted .w,#soundBtn:not(.muted) .x{display:none}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
#shade{position:fixed;inset:0;z-index:5;background:rgba(18,20,24,.14);opacity:0;pointer-events:none;transition:opacity .8s}
#shade.on{opacity:1;pointer-events:auto}
#info{position:fixed;z-index:6;left:50%;top:var(--itop);width:var(--cs);aspect-ratio:1/1;border-radius:50%;background:var(--paper);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
  box-shadow:0 30px 80px rgba(0,0,0,.2),inset 0 0 0 1px var(--line);display:grid;place-items:center;text-align:center;
  opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.3);transition:transform 1s cubic-bezier(.2,.75,.2,1),opacity .7s ease;overflow:hidden}
#info::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,var(--line) 0 1.5px,transparent 1.5px 32px),repeating-linear-gradient(90deg,var(--line) 0 1.5px,transparent 1.5px 32px);
  -webkit-mask-image:radial-gradient(circle,transparent 60%,#000 80%);mask-image:radial-gradient(circle,transparent 60%,#000 80%)}
#info.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#info .inner{position:relative;width:74%}
.cond{font-size:clamp(15px,1.9vh,19px);color:var(--muted)}
.temp{font-weight:300;font-size:clamp(54px,8.6vh,82px);line-height:1;margin:.14em 0 .12em;letter-spacing:-.02em}
.pair{display:flex;justify-content:center;gap:1.3em;font-size:14px;color:var(--muted);flex-wrap:wrap}
.pair b{font-weight:400;color:var(--ink)}
.sunset{margin:1em 0 .1em;font-family:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;font-size:clamp(17px,2.2vh,21px);line-height:1.4}
.sunset small{display:block;font-family:"Zen Kaku Gothic New","Hiragino Sans",Arial,sans-serif;font-size:13px;color:var(--muted);margin-top:.3em}
.minor{font-size:13px;color:var(--muted);line-height:1.65;margin-top:.8em}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:.7em;opacity:.9}
#fcast{position:fixed;z-index:6;left:50%;top:calc(var(--itop) + var(--cs) / 2 + 16px);width:min(calc(100vw - 32px),560px);
  max-height:calc(100% - var(--itop) - var(--cs) / 2 - 24px - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--paper);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);border-radius:24px;padding:14px 12px 12px;
  box-shadow:0 20px 60px rgba(0,0,0,.18),inset 0 0 0 1px var(--line);color:var(--ink);
  opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .6s ease,transform .9s cubic-bezier(.2,.75,.2,1)}
#fcast.open{opacity:1;pointer-events:auto;transform:translate(-50%,0);transition-delay:.18s}
.fsum{margin:0 8px 10px;font-family:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;font-size:clamp(16px,2vh,19px);line-height:1.5;text-wrap:balance;text-align:center}
.fhours{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.fhours::-webkit-scrollbar{display:none}
.fh{flex:0 0 auto;min-width:50px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 5px;border:0;border-radius:14px;
  background:transparent;color:var(--ink);font:inherit;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:pan-x}
.fh:active,.fh:hover{background:var(--line)}
.fh:focus-visible{outline:2px solid currentColor;outline-offset:-2px}
.fhh{font-size:12.5px;color:var(--muted)}
.fht{font-size:15px}
.fhp{font-size:11.5px;color:var(--rain);min-height:1.25em}
.fg{display:block;width:24px;height:24px}
.fdays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.fd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.fdn{color:var(--muted);font-size:12.5px}
.fdt span{color:var(--muted)}
.fnote{margin:10px 8px 0;font-size:11.5px;line-height:1.45;color:var(--muted);text-align:center}
#fcast.empty .fhours,#fcast.empty .fdays,#fcast.empty .fnote{display:none}
#fcast.empty .fsum{margin-bottom:0;font-size:15px;color:var(--muted)}
@media (min-aspect-ratio:1/1){
  :root{--cs:min(40vw,430px,74vh)}
  #info{left:30%;top:50%}
  #fcast{left:70%;top:50%;width:min(44vw,460px);max-height:calc(100% - 32px);transform:translate(-50%,calc(-50% + 16px))}
  #fcast.open{transform:translate(-50%,-50%)}}
#settings{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(94vw,520px);max-height:calc(100% - 40px);overflow:auto;
  transform:translate(-50%,calc(100% + 60px));transition:transform .7s cubic-bezier(.2,.75,.2,1);background:var(--paper);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:26px;padding:20px 20px 16px;
  box-shadow:0 20px 60px rgba(0,0,0,.22),inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink)}
#settings.open{transform:translate(-50%,0)}
#settings h2{font-family:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;font-weight:500;font-size:20px;margin:0 0 2px}
#settings .sub{color:var(--muted);font-size:13px;margin:0 0 10px;line-height:1.45}
.row{margin:13px 0}
.row>.lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:7px}
.row>.lbl b{font-weight:400;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;line-height:1.2}
.chip.on{background:var(--ink);color:var(--paperSolid);border-color:var(--ink)}
#manualRows{transition:opacity .4s}
#manualRows.dim{opacity:.45}
input[type=range]{width:100%;accent-color:var(--seal);margin:0}
.bar{display:flex;gap:8px;margin-top:16px}
.bar .chip{flex:1;text-align:center;padding:10px}
#veil{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;cursor:pointer;
  background:radial-gradient(ellipse at 50% 50%,rgba(242,240,235,.5),rgba(232,230,225,.9) 72%);color:#2a2c30;
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);transition:opacity 2.6s ease}
#veil.night{background:radial-gradient(ellipse at 50% 50%,rgba(20,24,34,.45),rgba(14,17,26,.88) 72%);color:#e8e4da}
#veil h1{font-weight:400;font-size:clamp(30px,4.8vh,46px);letter-spacing:.08em;margin:14px 0 0}
#veil p{margin:0;font-size:15px;opacity:.72}
#veil .hint{margin-top:34px;font-size:13px;letter-spacing:.06em;opacity:.55;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.22}}
#veil.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bough{animation:none}#veil .hint{animation:none}#poem .w.in{-webkit-mask-image:none;mask-image:none;animation:fadeW 1.2s ease var(--d,0s) both}#poem .w.out{animation:fadeO 1s ease forwards}}
@keyframes fadeW{from{opacity:0}to{opacity:1}}@keyframes fadeO{to{opacity:0}}
</style>
</head>
<body>
<div id="stage">
<svg id="sky" class="layer" viewBox="0 0 1000 1600" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="gSky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1600">
      <stop offset="0" style="stop-color:var(--sk0)"/><stop offset=".5" style="stop-color:var(--sk1)"/><stop offset=".62" style="stop-color:var(--sk2)"/><stop offset="1" style="stop-color:var(--sk2)"/>
    </linearGradient>
    <radialGradient id="gSunGlow"><stop offset="0" style="stop-color:var(--sunc);stop-opacity:.7"/><stop offset=".22" style="stop-color:var(--sunc);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--sunc);stop-opacity:0"/></radialGradient>
    <radialGradient id="gMoonHalo"><stop offset="0" stop-color="#e6ecf6" stop-opacity=".26"/><stop offset=".28" stop-color="#e6ecf6" stop-opacity=".09"/><stop offset=".58" stop-color="#e6ecf6" stop-opacity=".025"/><stop offset=".67" stop-color="#f2dccb" stop-opacity=".08"/><stop offset=".72" stop-color="#e8eef8" stop-opacity=".11"/><stop offset=".78" stop-color="#c9d8f2" stop-opacity=".05"/><stop offset="1" stop-color="#e6ecf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gMoonGlow"><stop offset="0" stop-color="#dfe6f2" stop-opacity=".32"/><stop offset="1" stop-color="#dfe6f2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="-200" y="-400" width="1400" height="2000" fill="url(#gSky)"/>
  <g id="sunG" opacity="0"><circle r="210" fill="url(#gSunGlow)"/><circle r="27" style="fill:var(--sunc)"/></g>
  <circle id="moonHalo" r="190" fill="url(#gMoonHalo)" opacity="0"/>
  <g id="moonG" opacity="0"><circle r="90" fill="url(#gMoonGlow)"/><circle r="19" fill="#9aa3b5" opacity=".16"/><path id="moonLit" fill="#eef1f6"/></g>
</svg>
<canvas id="bg" class="layer"></canvas>
<svg id="main" class="layer" viewBox="0 0 1000 1600" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="gWater" gradientUnits="userSpaceOnUse" x1="0" y1="950" x2="0" y2="1750"><stop offset="0" style="stop-color:var(--wa0)"/><stop offset=".32" style="stop-color:var(--wa1)"/><stop offset="1" style="stop-color:var(--wa2)"/></linearGradient>
    <radialGradient id="gMist"><stop offset="0" style="stop-color:var(--mist);stop-opacity:.85"/><stop offset=".6" style="stop-color:var(--mist);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--mist);stop-opacity:0"/></radialGradient>
    <linearGradient id="gGlit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--glit);stop-opacity:.8"/><stop offset=".55" style="stop-color:var(--glit);stop-opacity:.25"/><stop offset="1" style="stop-color:var(--glit);stop-opacity:0"/></linearGradient>
    <linearGradient id="gFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".74"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <mask id="mFade" maskUnits="userSpaceOnUse" x="-100" y="951" width="1200" height="700"><rect x="-100" y="951" width="1200" height="700" fill="url(#gFade)"/></mask>
  </defs>
  <g id="trees">
    <g id="treesTall" class="far2"></g>
    <g id="hazeA"></g>
    <g id="treesFar" class="far0"></g>
    <g id="hazeB"></g>
    <g id="treesMid" class="far1"></g>
    <g class="far1"><rect x="872" y="902" width="96" height="46"/><path d="M858 905Q915 896 980 903L972 889Q915 882 866 892Z"/></g>
  </g>
  <rect x="-200" y="950" width="1400" height="1100" fill="url(#gWater)"/>
  <ellipse id="glit" cx="500" cy="1240" rx="30" ry="290" fill="url(#gGlit)" opacity="0"/>
  <g id="reflStatic" mask="url(#mFade)" style="display:none"><use href="#trees" transform="matrix(1 0 0 -1 0 1904)"/><use href="#arch" transform="matrix(1 0 0 -1 0 1904)"/></g>
</svg>
<canvas id="refl" class="layer"></canvas>
<svg id="main2" class="layer" viewBox="0 0 1000 1600" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="gRoom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rm1)"/><stop offset="1" style="stop-color:var(--rm2)"/></linearGradient>
    <linearGradient id="gStain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1a18" stop-opacity=".22"/><stop offset="1" stop-color="#1b1a18" stop-opacity="0"/></linearGradient>
    <clipPath id="cBig"><circle cx="345" cy="560" r="118"/></clipPath>
    <clipPath id="cSmall"><circle cx="318" cy="812" r="72"/></clipPath>
    <clipPath id="cRoof"><path id="roofPath" d="M556 540C620 536 720 533 815 532C866 531 898 522 922 499L916 493C900 498 884 488 872 470L590 471C574 473 562 483 556 496Z"/></clipPath>
    <pattern id="pLat" x="227" y="442" width="23.6" height="23.6" patternUnits="userSpaceOnUse"><rect width="23.6" height="2.4" class="fr"/><rect width="2.4" height="23.6" class="fr"/></pattern>
    <pattern id="pLatS" x="246" y="740" width="20.57" height="20.57" patternUnits="userSpaceOnUse"><rect width="20.57" height="2.2" class="fr"/><rect width="2.2" height="20.57" class="fr"/></pattern>
    <pattern id="pTiles" width="6.5" height="90" patternUnits="userSpaceOnUse"><rect width="1.6" height="90" fill="#000" opacity=".32"/></pattern>
    <linearGradient id="gWarm" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="925" y2="0"><stop id="wS0" offset="0" style="stop-color:var(--warmc)" stop-opacity=".2"/><stop id="wS1" offset="1" style="stop-color:var(--warmc)" stop-opacity="1"/></linearGradient>
  
    <radialGradient id="gLit" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#ffe7b8"/><stop offset=".65" stop-color="#f6bf70"/><stop offset="1" stop-color="#d98b42"/></radialGradient>
    <linearGradient id="gLitPav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9c0"/><stop offset="1" stop-color="#eea85b"/></linearGradient>
    <radialGradient id="gHalo"><stop offset="0" stop-color="#ffc36c" stop-opacity=".42"/><stop offset=".5" stop-color="#ffc36c" stop-opacity=".12"/><stop offset="1" stop-color="#ffc36c" stop-opacity="0"/></radialGradient>
    <pattern id="pLatL" x="227" y="442" width="23.6" height="23.6" patternUnits="userSpaceOnUse"><rect width="23.6" height="2.4" fill="#2a231b"/><rect width="2.4" height="23.6" fill="#2a231b"/></pattern>
    <pattern id="pLatSL" x="246" y="740" width="20.57" height="20.57" patternUnits="userSpaceOnUse"><rect width="20.57" height="2.2" fill="#2a231b"/><rect width="2.2" height="20.57" fill="#2a231b"/></pattern>
    <clipPath id="cBigL"><circle cx="345" cy="560" r="118"/></clipPath>
    <clipPath id="cSmallL"><circle cx="318" cy="812" r="72"/></clipPath>

<script>

function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const rgba=(c,a)=>`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${clamp(a).toFixed(3)})`;
const f1=n=>(Math.round(n*10)/10).toString();
function el(tag,at,p){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
const store={get(k,d){try{const v=localStorage.getItem('lac:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('lac:'+k,JSON.stringify(v))}catch(e){}}};
const rootStyle=document.documentElement.style;

/* ---------- Heure de Bruxelles & astronomie ---------- */
const dtf=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'});
function bxl(date){const p={};for(const x of dtf.formatToParts(date))p[x.type]=x.value;
  const o={y:+p.year,m:+p.month,d:+p.day,h:(+p.hour)%24,mi:+p.minute,s:+p.second};
  o.hd=o.h+o.mi/60+o.s/3600;o.doy=Math.round((Date.UTC(o.y,o.m-1,o.d)-Date.UTC(o.y,0,1))/864e5)+1;
  o.off=Math.round((Date.UTC(o.y,o.m-1,o.d,o.h,o.mi,o.s)-Math.floor(date.getTime()/1000)*1000)/60000);return o}
function makeDate(y,m,d,hd){const off=bxl(new Date(Date.UTC(y,m-1,d,12))).off;return new Date(Date.UTC(y,m-1,d)+hd*3600e3-off*60e3)}

  const g=(357.529+0.98560028*d)*rad,q=280.459+0.98564736*d,L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad,e=(23.439-0.00000036*d)*rad;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L));
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24,H=(gmst*15+LON)*rad-ra,lat=LAT*rad;
  const alt=Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat));
  return{alt:alt/rad,az:((az/rad+180)%360+360)%360}}
const sunCache={};
function sunTimes(date){const b=bxl(date),key=b.y+'-'+b.m+'-'+b.d;if(sunCache[key])return sunCache[key];
  const mid=makeDate(b.y,b.m,b.d,0).getTime();let rise=null,set=null,prev=sunPos(new Date(mid)).alt;
  for(let t=mid+120000;t<=mid+86400000;t+=120000){const a=sunPos(new Date(t)).alt;if(prev<-.833&&a>=-.833&&!rise)rise=new Date(t);if(prev>=-.833&&a<-.833&&rise&&!set)set=new Date(t);prev=a}
  return sunCache[key]={rise,set}}
function moonPhase(date){const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);let p=((date.getTime()-ref)/864e5/syn)%1;return p<0?p+1:p}
function moonName(p){if(p<.03||p>.97)return'Nouvelle lune';if(p<.22)return'Premier croissant';if(p<.28)return'Premier quartier';if(p<.47)return'Lune gibbeuse croissante';if(p<.53)return'Pleine lune';if(p<.72)return'Lune gibbeuse décroissante';if(p<.78)return'Dernier quartier';return'Dernier croissant'}
function moonSky(date,p){const b=bxl(date);const solar=((b.hd-b.off/60+LON/15)%24+24)%24;const transit=(12+p*24.84)%24;
  let h=solar-transit;while(h>12)h-=24;while(h<-12)h+=24;return{alt:50*Math.cos(h/12.42*Math.PI)-9,az:180+h*15}}

function moonPathD(p,r){const waxing=p<.5;const rx=Math.abs(Math.cos(2*Math.PI*p))*r;
  const crescent=(p<.25)||(p>.75);let d;
  if(waxing){d=`M0 ${-r}A${r} ${r} 0 0 1 0 ${r}A${f1(rx)} ${r} 0 0 ${crescent?0:1} 0 ${-r}Z`}
  else{d=`M0 ${-r}A${r} ${r} 0 0 0 0 ${r}A${f1(rx)} ${r} 0 0 ${crescent?1:0} 0 ${-r}Z`}return d}
function seasonOf(doy){return doy>=79&&doy<172?'printemps':doy>=172&&doy<266?'ete':doy>=266&&doy<355?'automne':'hiver'}
const pad=n=>String(n).padStart(2,'0');
function fmtT(date){const b=bxl(date);return`${b.h} h ${pad(b.mi)}`}
function fmtHd(hd){const h=Math.floor(hd),m=Math.floor((hd-h)*60);return`${h} h ${pad(m)}`}
function fmtDur(ms){const m=Math.round(ms/60000);if(m<60)return`${m} min`;return`${Math.floor(m/60)} h ${pad(m%60)}`}

/* ---------- Météo ---------- */
const WX_LABEL={0:'Ciel dégagé',1:'Plutôt dégagé',2:'Quelques nuages',3:'Ciel couvert',45:'Brouillard',48:'Brouillard givrant',51:'Bruine légère',53:'Bruine',55:'Bruine dense',56:'Bruine verglaçante',57:'Bruine verglaçante',61:'Pluie faible',63:'Pluie',65:'Forte pluie',66:'Pluie verglaçante',67:'Pluie verglaçante',71:'Neige faible',73:'Neige',75:'Forte neige',77:'Grésil',80:'Averses',81:'Averses',82:'Fortes averses',85:'Averses de neige',86:'Averses de neige',95:'Orage',96:'Orage et grêle',99:'Orage et grêle'};
function wxProfile(code){const P={rain:0,snow:0,thunder:false,fogBoost:0,minCloud:0};
  if(code==null)return P;
  if(code===45||code===48){P.fogBoost=1;P.minCloud=.5}
  else if(code>=51&&code<=57){P.rain=[.15,.25,.35][(code-51)/2|0]||.25;P.minCloud=.85}
  else if(code>=61&&code<=67){P.rain={61:.35,63:.6,65:.9,66:.4,67:.7}[code];P.minCloud=.95}
  else if(code>=71&&code<=77){P.snow={71:.3,73:.6,75:.95,77:.25}[code];P.minCloud=.95}
  else if(code>=80&&code<=82){P.rain={80:.45,81:.75,82:1}[code];P.minCloud=.8}
  else if(code===85||code===86){P.snow=code===85?.6:.9;P.minCloud=.9}
  else if(code>=95){P.rain=code===95?.7:.9;P.thunder=true;P.minCloud=1}
  return P}
function wxCat(W){if(W.thunder)return'orage';if(W.snow>.05)return'neige';if(W.rain>.05)return'pluie';if(W.fog>.75)return'brume';if(W.wind>38)return'vent';if(W.cloud>.55)return'nuages';return'clair'}
const PRESETS={
  clair:{code:0,cloud:.04,fog:.12,wind:7,hum:62},voile:{code:2,cloud:.45,fog:.25,wind:10,hum:70},couvert:{code:3,cloud:.96,fog:.3,wind:14,hum:80},
  brume:{code:45,cloud:.6,fog:1,wind:3,hum:97},bruine:{code:53,cloud:.92,fog:.45,wind:8,hum:94},pluie:{code:63,cloud:1,fog:.32,wind:16,hum:92},
  averse:{code:81,cloud:.95,fog:.2,wind:26,hum:86},orage:{code:95,cloud:1,fog:.1,wind:34,hum:78},neige:{code:73,cloud:1,fog:.35,wind:8,hum:90},vent:{code:2,cloud:.5,fog:0,wind:58,hum:58}};
const SEASON_T={printemps:13,ete:24,automne:11,hiver:2};
function presetWx(name,season){const p=PRESETS[name]||PRESETS.voile,pr=wxProfile(p.code);let temp=SEASON_T[season];if(name==='neige')temp=-1;if(name==='orage')temp+=3;
  if(season==='hiver'&&(name==='clair'||name==='brume'||name==='voile'))temp=-3;

function liveWx(L,b){const pr=wxProfile(L.code);let fog=pr.fogBoost?1:.1+clamp((L.hum-78)/22)*.5;if(b.hd>4&&b.hd<10.5&&L.hum>82)fog+=.2;
  return{code:L.code,cloud:Math.max(L.cloud,pr.minCloud),fog:clamp(fog),wind:L.wind,wdir:L.wdir,rain:pr.rain,snow:pr.snow,thunder:pr.thunder,temp:L.temp,hum:L.hum,app:L.app}}
function fallbackWx(b){const morning=b.hd>4.5&&b.hd<10.5;return{code:null,cloud:.4,fog:morning?.55:.3,wind:9,wdir:null,rain:0,snow:0,thunder:false,temp:null,hum:null,app:null}}
/* Relevé actuel (WX) et prévisions heure par heure (FC). Les prévisions prennent le relais quand le relevé vieillit,
   et servent quand on fait glisser le ciel vers l'avenir. */
let WX=store.get('wx',null);if(WX&&Date.now()-WX.at>3*3600e3)WX=null;
let FC=store.get('fc',null);if(FC&&(!FC.hours||Date.now()-FC.at>36*3600e3))FC=null;
let wxFailed=false;
const num=v=>v==null||isNaN(v)?null:+v;
function ingestOpenMeteo(j){const now=Date.now();
  if(j.current){const c=j.current;WX={code:num(c.weather_code),temp:num(c.temperature_2m),hum:num(c.relative_humidity_2m),app:num(c.apparent_temperature),cloud:(num(c.cloud_cover)??50)/100,wind:num(c.wind_speed_10m)??0,wdir:num(c.wind_direction_10m),at:now};store.set('wx',WX)}
  const H=j.hourly,D=j.daily;
  if(H&&H.time){const g=(k,i)=>H[k]?num(H[k][i]):null;

  if(!hs.length)return'';
  const cur=WX&&now-WX.at<45*60e3?WX:null,wetNow=wetH(hs[0])||(!!cur&&isPrecip(cur.code));let s;
  if(wetNow){const k0=kindOf(cur&&isPrecip(cur.code)?cur.code:hs[0].code);const j=hs.findIndex((h,i)=>i>0&&!wetH(h)&&!wetH(hs[i+1]));

  else{const i=hs.findIndex(wetH);s=i>=0?`Sec jusque vers ${hh(hs[i].t-3600e3)}, puis ${K_THEN[kindOf(hs[i].code)]}.`:`Pas de pluie prévue d'ici ${hh(hs[hs.length-1].t)}.`}
  const b=bxl(new Date(now)),t0=cur?cur.temp:hs[0].temp;

  else if(b.hd>=18||b.hd<5){const mn=Math.min(...hs.map(h=>h.temp));if(mn<t0-.6)s+=` Descente vers ${Math.round(mn)}° cette nuit.`}
